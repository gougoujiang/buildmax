# MySQL 8.0 for local dev inside kind cluster.
# Development credentials only: root and the buildmax account both use the
# password buildmax, and the entrypoint creates the buildmax schema.
# Connect in-cluster at mysql.db.svc.cluster.local:3306.
apiVersion: v1
kind: Namespace
metadata:
  name: db
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          # Pinned to a patch, not the floating 8.0 tag: a reload that silently
          # picks up a new minor is a variable in evidence meant to be
          # reproducible. Bump this deliberately.
          image: mysql:8.0.40
          env:
            - name: MYSQL_ROOT_PASSWORD
              value: "buildmax"
            - name: MYSQL_DATABASE
              value: "buildmax"
            - name: MYSQL_USER
              value: "buildmax"
            - name: MYSQL_PASSWORD
              value: "buildmax"
          ports:
            - containerPort: 3306
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
          # Headroom over the previous 512Mi/500m: MySQL 8.0 under the browser
          # suite's concurrent load was hitting readiness and liveness timeouts
          # and restarting, which dropped server readiness mid-run.
          resources:
            requests:
              memory: 512Mi
              cpu: 250m
            limits:
              memory: 1Gi
              cpu: "1"
          startupProbe:
            exec:
              command: ["mysqladmin", "ping", "-h", "127.0.0.1", "-u", "buildmax", "-pbuildmax", "--silent"]
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          # Liveness and readiness tolerate a busy-but-alive database: a single
          # slow `mysqladmin ping` under load is not a dead server, so a wider
          # timeout and a failureThreshold keep a transient stall from killing
          # the pod or flapping the Service off.
          livenessProbe:
            exec:
              command: ["mysqladmin", "ping", "-h", "127.0.0.1", "-u", "buildmax", "-pbuildmax", "--silent"]
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 6
          readinessProbe:
            exec:
              command: ["mysqladmin", "ping", "-h", "127.0.0.1", "-u", "buildmax", "-pbuildmax", "--silent"]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: db
spec:
  selector:
    app: mysql
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
