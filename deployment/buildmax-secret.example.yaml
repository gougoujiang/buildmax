# Template for the buildmax-secret used by deployment/buildmax-deploy.yaml.
#
# Copy this file to buildmax-secret.local.yaml and fill in real values:
#
#   cp deployment/buildmax-secret.example.yaml deployment/buildmax-secret.local.yaml
#
# buildmax-secret.local.yaml is gitignored. Never commit real credentials.
# ./make deploy applies it automatically before buildmax-deploy.yaml.
#
# Equivalent imperative form:
#
#   kubectl create secret generic buildmax-secret -n buildmax \
#     --from-literal=BUILDMAX_JWT_SECRET="$(openssl rand -base64 32)" \
#     --from-literal=BUILDMAX_WORKER_TOKEN="$(openssl rand -hex 24)" \
#     --from-literal=BUILDMAX_API_KEY=your-llm-api-key \
#     --dry-run=client -o yaml | kubectl apply -f -
apiVersion: v1
kind: Secret
metadata:
  name: buildmax-secret
  namespace: buildmax
type: Opaque
stringData:
  # Signing key for user JWTs. Generate with: openssl rand -base64 32
  BUILDMAX_JWT_SECRET: "replace-me-jwt-secret"
  # Shared token the worker uses to call /api/worker/*. Generate with: openssl rand -hex 24
  BUILDMAX_WORKER_TOKEN: "replace-me-worker-token"
  # API key for the configured LLM provider (OpenRouter by default).
  BUILDMAX_API_KEY: "replace-me-llm-api-key"
  # Optional, local development only. When set, this single code logs in EVERY
  # registered email address. Omit the key entirely to keep login disabled.
  # BUILDMAX_DEV_LOGIN_OTP: "123456"
