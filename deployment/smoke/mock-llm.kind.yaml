apiVersion: apps/v1
kind: Deployment
metadata:
  name: buildmax-smoke-llm
  namespace: buildmax
spec:
  replicas: 1
  selector:
    matchLabels:
      app: buildmax-smoke-llm
  template:
    metadata:
      labels:
        app: buildmax-smoke-llm
    spec:
      containers:
        - name: mock-llm
          image: buildmax-smoke-llm:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: buildmax-smoke-llm
  namespace: buildmax
spec:
  selector:
    app: buildmax-smoke-llm
  ports:
    - name: http
      port: 8080
      targetPort: http
