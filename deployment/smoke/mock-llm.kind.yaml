apiVersion: apps/v1
kind: Deployment
metadata:
  name: buildmax-smoke-llm
  namespace: buildmax
spec:
  replicas: 1
  selector:
    matchLabels:
      app: buildmax-smoke-llm
  template:
    metadata:
      labels:
        app: buildmax-smoke-llm
    spec:
      containers:
        - name: mock-llm
          image: buildmax-smoke-llm:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: buildmax-smoke-llm
  namespace: buildmax
spec:
  selector:
    app: buildmax-smoke-llm
  ports:
    - name: http
      port: 8080
      targetPort: http
---
# The smoke reaches the mock from outside the cluster for one purpose: arming a
# stall, so a run stays mid-turn long enough to cancel it. Only that route is
# published — the model protocol itself stays on the in-cluster Service, where a
# run reaching it is evidence the deployment wired the model up.
#
# Smoke-only. Nothing in deployment/production/ exposes a test double.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: buildmax-smoke-llm-control
  namespace: buildmax
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /smoke-llm/control/stall
            pathType: Exact
            backend:
              service:
                name: buildmax-smoke-llm
                port:
                  number: 8080
