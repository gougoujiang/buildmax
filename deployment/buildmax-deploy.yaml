# BuildMax server deployment for a Kubernetes cluster. `./make kind up` applies
# a local smoke overlay; operators can use this file as the readable baseline.
#
# This file contains NO credentials. The buildmax-secret it references must be
# created separately:
#
#   cp deployment/buildmax-secret.example.yaml deployment/buildmax-secret.local.yaml
#   # fill in real values, then:
#   kubectl apply -f deployment/buildmax-secret.local.yaml
#
# buildmax-secret.local.yaml is gitignored; ./make kind up applies it for you.
#
# The local kind path exposes Portal and API on http://localhost:8080.
---
apiVersion: v1
kind: Namespace
metadata:
  name: buildmax
---
# Non-secret server configuration. Mounted as <BUILDMAX_HOME>/server.yaml into the
# server pod and into every worker Job pod, so both read the same file.
# Credentials are NOT here — they come from buildmax-secret via the environment
# overrides below, which take precedence over the fields in this file.
apiVersion: v1
kind: ConfigMap
metadata:
  name: buildmax-config
  namespace: buildmax
data:
  server.yaml: |
    log_level: info
    port: 5678
    cors_origin: http://localhost:8080
    workspaces_dir: /buildmax/workspaces
    default_quota_tier: free_trial

    conversation:
      model:
        model: openai/gpt-4o-mini
        api_url: https://openrouter.ai/api/v1
        context_window: 128000
        # api_key comes from BUILDMAX_CONVERSATION_MODEL_API_KEY

    database:
      host: mysql.db.svc.cluster.local
      port: 3306
      user: buildmax
      name: buildmax
      # password comes from BUILDMAX_DATABASE_PASSWORD

    webhook:
      message_path: message
      user_id: webhook

    worker:
      binary: buildmax-worker
      run_mode: k8s_job
      server_url: http://buildmax.buildmax.svc.cluster.local:5678
      # token comes from BUILDMAX_WORKER_TOKEN
      k8s:
        namespace: buildmax
        image: buildmax:local
        config_map: buildmax-config
        home_dir: /buildmax
        # Worker pods are always created non-root, with no service-account
        # token, no added capabilities, and a read-only root filesystem —
        # that containment is not configurable, because a worker runs
        # model-chosen shell commands. Set run_as_user only on a cluster that
        # assigns its own uid range, OpenShift most commonly.
        # run_as_user: 1000700000
        #
        # Resource bounds are opt-in: unset means unbounded. These are a
        # starting point, not a measurement — raise them if runs are killed.
        resources:
          cpu_request: 250m
          cpu_limit: "2"
          memory_request: 512Mi
          memory_limit: 2Gi

    storage:
      persist_backend: minio
      artifact_backend: minio
      minio:
        endpoint: http://minio.storage.svc.cluster.local:9000
        region: us-east-1
        bucket: bmstore
        prefix: workspaces
        # access_key / secret_key come from BUILDMAX_STORAGE_MINIO_*
---
# ServiceAccount for server; used when worker.run_mode is k8s_job to create worker Jobs.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: buildmax-server
  namespace: buildmax
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: buildmax-server
  namespace: buildmax
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: buildmax-server
  namespace: buildmax
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: buildmax-server
subjects:
  - kind: ServiceAccount
    name: buildmax-server
    namespace: buildmax
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: buildmax-server
  namespace: buildmax
  labels:
    app: buildmax-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: buildmax-server
  template:
    metadata:
      labels:
        app: buildmax-server
    spec:
      serviceAccountName: buildmax-server
      # The same containment the production reference applies. It lives here
      # too so `./make kind up` exercises it on every run — a hardening setting
      # that only appears in a manifest nobody applies is a guess.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          image: buildmax:local
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/buildmax-server"]
          ports:
            - containerPort: 5678
              name: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # Readiness reflects MySQL and object storage, so a dependency outage
          # takes this pod out of the Service instead of letting it accept
          # requests it cannot serve.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            # Failing readiness only stops traffic, so tolerate a brief blip
            # rather than flapping the endpoint on one slow query.
            failureThreshold: 3
          # Liveness stays on /healthz, which checks nothing. A liveness probe
          # that failed on a dependency outage would restart a healthy server
          # and turn a recoverable outage into a crash loop.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          env:
            # Locates server.yaml and holds sessions, logs, and traces.
            - name: BUILDMAX_HOME
              value: "/buildmax"
            # Credentials only. Each overrides the matching server.yaml field.
            - name: BUILDMAX_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: buildmax-secret
                  key: BUILDMAX_JWT_SECRET
            - name: BUILDMAX_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: buildmax-secret
                  key: BUILDMAX_DATABASE_PASSWORD
            - name: BUILDMAX_STORAGE_MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: buildmax-secret
                  key: BUILDMAX_STORAGE_MINIO_ACCESS_KEY
            - name: BUILDMAX_STORAGE_MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: buildmax-secret
                  key: BUILDMAX_STORAGE_MINIO_SECRET_KEY
            - name: BUILDMAX_WORKER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: buildmax-secret
                  key: BUILDMAX_WORKER_TOKEN
            - name: BUILDMAX_CONVERSATION_MODEL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: buildmax-secret
                  key: BUILDMAX_CONVERSATION_MODEL_API_KEY
          volumeMounts:
            - name: buildmax-home
              mountPath: /buildmax
            # subPath mounts the single file, leaving the rest of BUILDMAX_HOME writable.
            - name: buildmax-config
              mountPath: /buildmax/server.yaml
              subPath: server.yaml
              readOnly: true
            # The root filesystem is read-only; this is the writable path
            # ordinary tooling assumes.
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 512Mi
              cpu: 500m
      volumes:
        - name: buildmax-home
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: buildmax-config
          configMap:
            name: buildmax-config
---
apiVersion: v1
kind: Service
metadata:
  name: buildmax
  namespace: buildmax
spec:
  selector:
    app: buildmax-server
  ports:
    - name: http
      port: 5678
      targetPort: 5678
---
# Portal (React app served by nginx).
#
# Image: buildmax-portal:local, built by ./make kind images. This manifest
# targets the local kind cluster; a real deployment pulls the published image,
# ghcr.io/gougoujiang/buildmax-portal:<version>, and sets the same
# BUILDMAX_API_BASE. See docs/deploy/overview.md.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: buildmax-portal
  namespace: buildmax
  labels:
    app: buildmax-portal
spec:
  replicas: 1
  selector:
    matchLabels:
      app: buildmax-portal
  template:
    metadata:
      labels:
        app: buildmax-portal
    spec:
      containers:
        - name: portal
          image: buildmax-portal:local
          imagePullPolicy: IfNotPresent
          env:
            # Portal and API share one Ingress origin. Runtime config.js keeps
            # the image portable while avoiding local host aliases and CORS.
            - name: BUILDMAX_API_BASE
              value: /
          ports:
            - containerPort: 80
              name: http
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              memory: 64Mi
              cpu: 50m
            limits:
              memory: 128Mi
              cpu: 200m
---
apiVersion: v1
kind: Service
metadata:
  name: buildmax-portal
  namespace: buildmax
spec:
  selector:
    app: buildmax-portal
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: buildmax-portal
  namespace: buildmax
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: buildmax
                port:
                  number: 5678
          - path: /healthz
            pathType: Exact
            backend:
              service:
                name: buildmax
                port:
                  number: 5678
          - path: /openapi.json
            pathType: Exact
            backend:
              service:
                name: buildmax
                port:
                  number: 5678
          - path: /swagger
            pathType: Prefix
            backend:
              service:
                name: buildmax
                port:
                  number: 5678
          - path: /
            pathType: Prefix
            backend:
              service:
                name: buildmax-portal
                port:
                  number: 80
