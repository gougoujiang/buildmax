# BuildMax server deployment for a Kubernetes cluster. `./make kind up` applies
# a local smoke overlay; operators can use this file as the readable baseline.
#
# This file contains NO credentials. The buildmax-secret it references must be
# created separately:
#
#   cp deployment/buildmax-secret.example.yaml deployment/buildmax-secret.local.yaml
#   # fill in real values, then:
#   kubectl apply -f deployment/buildmax-secret.local.yaml
#
# buildmax-secret.local.yaml is gitignored; ./make deploy applies it for you.
#
# The local kind path exposes Portal and API on http://localhost:8080.
---
apiVersion: v1
kind: Namespace
metadata:
  name: buildmax
---
# Non-secret server configuration. Mounted as <BUILDMAX_HOME>/server.yaml into the
# server pod and into every worker Job pod, so both read the same file.
# Credentials are NOT here — they come from buildmax-secret via the environment
# overrides below, which take precedence over the fields in this file.
apiVersion: v1
kind: ConfigMap
metadata:
  name: buildmax-config
  namespace: buildmax
data:
  server.yaml: |
    log_level: info
    port: 5678
    cors_origin: http://localhost:8080
    workspaces_dir: /buildmax/workspaces
    default_quota_tier: free_trial

    conversation:
      model:
        model: openai/gpt-4o-mini
        api_url: https://openrouter.ai/api/v1
        context_window: 128000
        # api_key comes from BUILDMAX_CONVERSATION_MODEL_API_KEY

    database:
      host: mysql.db.svc.cluster.local
      port: 3306
      user: buildmax
      name: buildmax
      # password comes from BUILDMAX_DATABASE_PASSWORD

    webhook:
      message_path: message
      user_id: webhook

    worker:
      binary: buildmax-worker
      run_mode: k8s_job
      server_url: http://buildmax.buildmax.svc.cluster.local:5678
      # token comes from BUILDMAX_WORKER_TOKEN
      k8s:
        namespace: buildmax
        image: buildmax:local
        config_map: buildmax-config
        home_dir: /buildmax

    storage:
      persist_backend: minio
      artifact_backend: minio
      minio:
        endpoint: http://minio.storage.svc.cluster.local:9000
        region: us-east-1
        bucket: bmstore
        prefix: workspaces
        # access_key / secret_key come from BUILDMAX_STORAGE_MINIO_*
---
# ServiceAccount for server; used when worker.run_mode is k8s_job to create worker Jobs.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: buildmax-server
  namespace: buildmax
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: buildmax-server
  namespace: buildmax
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: buildmax-server
  namespace: buildmax
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: buildmax-server
subjects:
  - kind: ServiceAccount
    name: buildmax-server
    namespace: buildmax
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: buildmax-server
  namespace: buildmax
  labels:
    app: buildmax-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: buildmax-server
  template:
    metadata:
      labels:
        app: buildmax-server
    spec:
      serviceAccountName: buildmax-server
      containers:
        - name: server
          image: buildmax:local
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/buildmax-server"]
          ports:
            - containerPort: 5678
              name: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          env:
            # Locates server.yaml and holds sessions, logs, and traces.
            - name: BUILDMAX_HOME
              value: "/buildmax"
            # Credentials only. Each overrides the matching server.yaml field.
            - name: BUILDMAX_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: buildmax-secret
                  key: BUILDMAX_JWT_SECRET
            - name: BUILDMAX_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: buildmax-secret
                  key: BUILDMAX_DATABASE_PASSWORD
            - name: BUILDMAX_STORAGE_MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: buildmax-secret
                  key: BUILDMAX_STORAGE_MINIO_ACCESS_KEY
            - name: BUILDMAX_STORAGE_MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: buildmax-secret
                  key: BUILDMAX_STORAGE_MINIO_SECRET_KEY
            - name: BUILDMAX_WORKER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: buildmax-secret
                  key: BUILDMAX_WORKER_TOKEN
            - name: BUILDMAX_CONVERSATION_MODEL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: buildmax-secret
                  key: BUILDMAX_CONVERSATION_MODEL_API_KEY
            # Development fixed login OTP. Optional: when the secret has no
            # BUILDMAX_DEV_LOGIN_OTP key, login stays disabled (503). This kind
            # manifest is a local dev environment, not a deployment template for
            # an internet-facing cluster.
            - name: BUILDMAX_DEV_LOGIN_OTP
              valueFrom:
                secretKeyRef:
                  name: buildmax-secret
                  key: BUILDMAX_DEV_LOGIN_OTP
                  optional: true
          volumeMounts:
            - name: buildmax-home
              mountPath: /buildmax
            # subPath mounts the single file, leaving the rest of BUILDMAX_HOME writable.
            - name: buildmax-config
              mountPath: /buildmax/server.yaml
              subPath: server.yaml
              readOnly: true
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 512Mi
              cpu: 500m
      volumes:
        - name: buildmax-home
          emptyDir: {}
        - name: buildmax-config
          configMap:
            name: buildmax-config
---
apiVersion: v1
kind: Service
metadata:
  name: buildmax
  namespace: buildmax
spec:
  selector:
    app: buildmax-server
  ports:
    - name: http
      port: 5678
      targetPort: 5678
---
# Portal (React app served by nginx).
#
# Image: buildmax-portal:local, built by ./make pub_images. This manifest
# targets the local kind cluster; a real deployment pulls the published image,
# ghcr.io/gougoujiang/buildmax-portal:<version>, and sets the same
# BUILDMAX_API_BASE. See docs/deploy/overview.md.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: buildmax-portal
  namespace: buildmax
  labels:
    app: buildmax-portal
spec:
  replicas: 1
  selector:
    matchLabels:
      app: buildmax-portal
  template:
    metadata:
      labels:
        app: buildmax-portal
    spec:
      containers:
        - name: portal
          image: buildmax-portal:local
          imagePullPolicy: IfNotPresent
          env:
            # Portal and API share one Ingress origin. Runtime config.js keeps
            # the image portable while avoiding local host aliases and CORS.
            - name: BUILDMAX_API_BASE
              value: /
          ports:
            - containerPort: 80
              name: http
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              memory: 64Mi
              cpu: 50m
            limits:
              memory: 128Mi
              cpu: 200m
---
apiVersion: v1
kind: Service
metadata:
  name: buildmax-portal
  namespace: buildmax
spec:
  selector:
    app: buildmax-portal
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: buildmax-portal
  namespace: buildmax
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: buildmax
                port:
                  number: 5678
          - path: /healthz
            pathType: Exact
            backend:
              service:
                name: buildmax
                port:
                  number: 5678
          - path: /openapi.json
            pathType: Exact
            backend:
              service:
                name: buildmax
                port:
                  number: 5678
          - path: /swagger
            pathType: Prefix
            backend:
              service:
                name: buildmax
                port:
                  number: 5678
          - path: /
            pathType: Prefix
            backend:
              service:
                name: buildmax-portal
                port:
                  number: 80
