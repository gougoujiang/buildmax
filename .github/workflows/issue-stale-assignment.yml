name: Stale Assignment Sweep

# Release issues that were claimed and then went quiet, so an abandoned claim
# does not keep others from picking the work up. Two phases: warn after
# STALE_DAYS of no human comment, then unassign after a further GRACE_DAYS if
# still quiet. Any human comment after the warning cancels it.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: issue-stale-assignment
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const STALE_DAYS = 14;
            const GRACE_DAYS = 7;
            const LABEL = 'stale-assignment';
            const DAY = 24 * 60 * 60 * 1000;
            const now = Date.now();
            const common = { owner: context.repo.owner, repo: context.repo.repo };

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              ...common,
              state: 'open',
              assignee: '*',
              per_page: 100,
            });

            for (const issue of issues) {
              // paginate returns pull requests too; skip them.
              if (issue.pull_request) continue;
              const n = issue.number;

              // Latest human activity: the newest non-bot comment, or issue
              // creation if there are none.
              const comments = await github.paginate(
                github.rest.issues.listComments,
                { ...common, issue_number: n, per_page: 100 },
              );
              const humanComments = comments.filter(
                (c) => c.user && c.user.type !== 'Bot',
              );
              const lastHuman = humanComments.length
                ? new Date(humanComments[humanComments.length - 1].created_at).getTime()
                : new Date(issue.created_at).getTime();

              const labeled = (issue.labels || []).some(
                (l) => (typeof l === 'string' ? l : l.name) === LABEL,
              );

              if (!labeled) {
                if (now - lastHuman > STALE_DAYS * DAY) {
                  await github.rest.issues.addLabels({
                    ...common,
                    issue_number: n,
                    labels: [LABEL],
                  });
                  const who = (issue.assignees || [])
                    .map((a) => `@${a.login}`)
                    .join(', ');
                  await github.rest.issues.createComment({
                    ...common,
                    issue_number: n,
                    body: `${who} this issue has had no activity for ${STALE_DAYS} ` +
                      `days. Comment to keep it, otherwise it is unassigned in ` +
                      `${GRACE_DAYS} days so someone else can pick it up.`,
                  });
                }
                continue;
              }

              // Already warned. Find when the warning label was applied.
              const events = await github.paginate(github.rest.issues.listEvents, {
                ...common,
                issue_number: n,
                per_page: 100,
              });
              const labelEvents = events.filter(
                (e) => e.event === 'labeled' && e.label && e.label.name === LABEL,
              );
              if (!labelEvents.length) continue;
              const labeledAt = new Date(
                labelEvents[labelEvents.length - 1].created_at,
              ).getTime();

              // A human comment after the warning means the work is alive again.
              if (lastHuman > labeledAt) {
                await github.rest.issues.removeLabel({
                  ...common,
                  issue_number: n,
                  name: LABEL,
                });
                continue;
              }

              if (now - labeledAt > GRACE_DAYS * DAY) {
                const who = (issue.assignees || []).map((a) => a.login);
                if (who.length) {
                  await github.rest.issues.removeAssignees({
                    ...common,
                    issue_number: n,
                    assignees: who,
                  });
                }
                await github.rest.issues.removeLabel({
                  ...common,
                  issue_number: n,
                  name: LABEL,
                });
                await github.rest.issues.createComment({
                  ...common,
                  issue_number: n,
                  body: `Unassigned after ${STALE_DAYS + GRACE_DAYS} days without ` +
                    `activity. Comment \`/assign\` to claim it again.`,
                });
              }
            }
