name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go (build, vet, test)
    runs-on: ubuntu-latest
    env:
      # An explicit GOBIN, so the cached path below is exactly where `go install`
      # writes rather than wherever GOPATH resolves to on the runner. Guessing
      # wrong there would cache an empty directory and silently reinstall every
      # tool on every run. The leading dot keeps it out of `./...`.
      GOBIN: ${{ github.workspace }}/.ci-tools
      # Tool versions are pinned here rather than at each call site so that the
      # tool cache key below invalidates on a bump instead of serving a stale
      # binary.
      ACTIONLINT_VERSION: v1.7.12
      GITLEAKS_VERSION: v8.30.1
      GOLANGCI_LINT_VERSION: v2.12.2
      GOVULNCHECK_VERSION: v1.7.0
      GO_LICENSES_VERSION: v1.6.0
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # setup-go keys its cache on go.sum alone, so every Linux job here shared
      # one entry and whichever finished first saved it -- the light policy job,
      # which left this one, the heaviest, compiling everything from cold. This
      # job keeps its own entry instead.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      # Restored on every run but written only from main. A per-commit key on
      # pull requests would push a few hundred megabytes into the repository's
      # shared 10 GB cache budget on every push to every branch, and evict the
      # entries the other jobs depend on.
      - name: Restore Go build cache
        id: go-build-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-build-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-build-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-build-${{ runner.os }}-

      # These tools live outside this module, so the module cache never held
      # them and `go run pkg@version` re-downloaded and recompiled each one on
      # every run -- 184 module downloads in the lint step alone. Install them
      # once and cache the binaries.
      - name: Cache Go tools
        id: go-tools-cache
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.ci-tools
          key: go-tools-${{ runner.os }}-${{ hashFiles('go.mod') }}-${{ env.ACTIONLINT_VERSION }}-${{ env.GITLEAKS_VERSION }}-${{ env.GOLANGCI_LINT_VERSION }}-${{ env.GOVULNCHECK_VERSION }}-${{ env.GO_LICENSES_VERSION }}

      - name: Install Go tools
        if: steps.go-tools-cache.outputs.cache-hit != 'true'
        run: |
          go install "github.com/rhysd/actionlint/cmd/actionlint@$ACTIONLINT_VERSION"
          go install "github.com/zricethezav/gitleaks/v8@$GITLEAKS_VERSION"
          go install "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@$GOLANGCI_LINT_VERSION"
          go install "golang.org/x/vuln/cmd/govulncheck@$GOVULNCHECK_VERSION"
          go install "github.com/google/go-licenses@$GO_LICENSES_VERSION"

      - name: Put Go tools on PATH
        run: echo "$GOBIN" >> "$GITHUB_PATH"

      # gofmt walks the filesystem, not the module, so `gofmt -l .` also reads
      # node_modules once anyone has run npm install. Formatting npm-shipped Go
      # sources is not this repository's business; tracked files are.
      - name: Check formatting
        run: |
          unformatted=$(git ls-files '*.go' -z | xargs -0 gofmt -l)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$unformatted"
            echo "Run: git ls-files '*.go' -z | xargs -0 gofmt -w"
            exit 1
          fi

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Check GitHub Actions workflows
        run: actionlint

      - name: Scan Git history for secrets
        run: gitleaks git --redact --no-banner --exit-code 1

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # Configuration and rationale: .golangci.yml.
      - name: Lint
        run: golangci-lint run ./...

      # Known vulnerabilities in the Go toolchain and in dependencies this code
      # actually calls. Reachability-based, so it fails only on code paths that
      # exist here.
      - name: Check for known vulnerabilities
        run: govulncheck ./...

      # -race here and not on Windows: the agent runtime, the scheduler, and the
      # websocket hub are all concurrent, and this is the job that exercises
      # them on the platform CI trusts most.
      - name: Test
        env:
          # Tests write their data directory here instead of ~/.buildmax.
          BUILDMAX_HOME: ./testing-sandbox
        run: go test -race ./...

      # Fails on copyleft that would conflict with redistributing under
      # Apache-2.0. See docs/contribute/dependency-licenses.md.
      - name: Check dependency licenses
        run: go-licenses check ./cmd/... --disallowed_types=forbidden,restricted

      - name: Save Go build cache
        if: github.event_name == 'push' && steps.go-build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ steps.go-build-cache.outputs.cache-primary-key }}

  go-windows:
    name: Go (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # Runs through make.bat so the shim and the cmd/mk task runner are covered
      # alongside the suite.
      - name: Test
        run: .\make.bat test

  contributor-quickstart:
    name: Contributor quickstart (fresh clone)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            gui/package-lock.json
            portal/package-lock.json
            desktop/frontend/package-lock.json

      - name: Use pinned npm
        run: npm install --global npm@11.17.0

      # These are the exact first commands in the contributor path. Running
      # them in a pristine checkout catches missing generated files, inaccurate
      # prerequisites, task-runner drift, and accidental writes to the repo.
      - name: Diagnose toolchain
        run: ./make doctor all

      - name: Build CLI
        run: ./make build cli

      - name: Run tests
        run: ./make test

      - name: Verify quickstart leaves tracked files unchanged
        run: git diff --exit-code

  frontend:
    name: Frontend (gui, portal, desktop)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            gui/package-lock.json
            portal/package-lock.json
            desktop/frontend/package-lock.json

      - name: Use pinned npm
        run: npm install --global npm@11.17.0

      # portal depends on @buildmax/gui via a file: link, so gui builds first.
      # gui has no ESLint step: typescript-eslint does not support the
      # TypeScript 7 it builds with, and its own build type-checks it.
      - name: Build gui
        working-directory: gui
        run: |
          npm ci
          npm run build

      - name: Build portal
        working-directory: portal
        run: |
          npm ci
          npm run lint
          npm run build
          npm test

      - name: Build desktop frontend
        working-directory: desktop/frontend
        run: |
          npm ci
          npm run lint
          npm run build
          npm test

      - name: Verify installs leave lockfiles unchanged
        run: git diff --exit-code

  open-source-policy:
    name: Open source policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Node for markdownlint; Go because the license check is a cmd/mk task and
      # reads the lockfiles directly rather than through npm.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Use pinned npm
        run: npm install --global npm@11.17.0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Lint Markdown
        run: npm exec --yes --package=markdownlint-cli2@0.23.2 -- markdownlint-cli2

      - name: Check npm production dependency licenses
        run: go run ./cmd/mk release licenses

  release-snapshot:
    name: Release snapshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Pull requests only need to prove that the release configuration is
      # valid. The full 15-binary snapshot remains a post-merge and manual
      # check, where its runtime does not hold up review.
      - name: Check release configuration
        if: github.event_name == 'pull_request'
        uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.17.1
          args: check

      - uses: actions/setup-go@v7
        if: github.event_name != 'pull_request'
        with:
          go-version-file: go.mod
          cache: true

      - name: Install release license tool
        if: github.event_name != 'pull_request'
        run: go install github.com/google/go-licenses@v1.6.0

      - uses: anchore/sbom-action/download-syft@v0.24.0
        if: github.event_name != 'pull_request'
        with:
          syft-version: v1.51.0

      - uses: goreleaser/goreleaser-action@v7
        if: github.event_name != 'pull_request'
        with:
          version: v2.17.1
          args: release --snapshot --clean --skip=publish,docker
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify all release archive contents
        if: github.event_name != 'pull_request'
        run: go run ./cmd/mk release verify --all

      - name: Upload release archives
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: release-snapshot
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
          if-no-files-found: error
          retention-days: 1

  release-archive-smoke:
    name: Release archive (${{ matrix.name }})
    if: github.event_name != 'pull_request'
    needs: release-snapshot
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
          - name: macOS
            os: macos-latest
          - name: Windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/download-artifact@v8
        with:
          name: release-snapshot
          path: dist

      - name: Verify native release archive
        run: go run ./cmd/mk release verify
