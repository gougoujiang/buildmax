name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go (build, vet, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$unformatted"
            echo "Run: gofmt -w ."
            exit 1
          fi

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        env:
          # Tests write their data directory here instead of ~/.buildmax.
          BUILDMAX_HOME: ./testing-sandbox
        run: go test ./...

      # Fails on copyleft that would conflict with redistributing under
      # Apache-2.0. See docs/dependency-licenses.md.
      - name: Check dependency licenses
        run: |
          go install github.com/google/go-licenses@latest
          go-licenses check ./cmd/... --disallowed_types=forbidden,restricted

  frontend:
    name: Frontend (gui, portal)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # portal depends on @buildmax/gui via a file: link, so gui builds first.
      - name: Build gui
        working-directory: gui
        run: |
          npm install
          npm run build

      - name: Build portal
        working-directory: portal
        run: |
          npm install
          npm run build
