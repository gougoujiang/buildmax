name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go (build, vet, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$unformatted"
            echo "Run: gofmt -w ."
            exit 1
          fi

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Check GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Scan Git history for secrets
        run: go run github.com/zricethezav/gitleaks/v8@v8.30.1 git --redact --no-banner --exit-code 1

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        env:
          # Tests write their data directory here instead of ~/.buildmax.
          BUILDMAX_HOME: ./testing-sandbox
        run: go test ./...

      # Fails on copyleft that would conflict with redistributing under
      # Apache-2.0. See docs/contribute/dependency-licenses.md.
      - name: Check dependency licenses
        run: |
          go install github.com/google/go-licenses@v1.6.0
          go-licenses check ./cmd/... --disallowed_types=forbidden,restricted

  go-windows:
    name: Go (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # Runs through make.bat so the shim and the cmd/mk task runner are covered
      # alongside the suite.
      - name: Test
        run: .\make.bat test

  frontend:
    name: Frontend (gui, portal, desktop)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # portal depends on @buildmax/gui via a file: link, so gui builds first.
      - name: Build gui
        working-directory: gui
        run: |
          npm ci
          npm run build

      - name: Build portal
        working-directory: portal
        run: |
          npm ci
          npm run build
          npm test

      - name: Build desktop frontend
        working-directory: desktop/frontend
        run: |
          npm ci
          npm run build

  open-source-policy:
    name: Open source policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Lint Markdown
        run: npm exec --yes --package=markdownlint-cli2@0.23.2 -- markdownlint-cli2

      - name: Check npm production dependency licenses
        run: node scripts/check-npm-licenses.mjs

  release-snapshot:
    name: Release snapshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Pull requests only need to prove that the release configuration is
      # valid. The full 15-binary snapshot remains a post-merge and manual
      # check, where its runtime does not hold up review.
      - name: Check release configuration
        if: github.event_name == 'pull_request'
        uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.17.1
          args: check

      - uses: actions/setup-go@v7
        if: github.event_name != 'pull_request'
        with:
          go-version-file: go.mod
          cache: true

      - name: Install release license tool
        if: github.event_name != 'pull_request'
        run: go install github.com/google/go-licenses@v1.6.0

      - uses: anchore/sbom-action/download-syft@v0.24.0
        if: github.event_name != 'pull_request'
        with:
          syft-version: v1.51.0

      - uses: goreleaser/goreleaser-action@v7
        if: github.event_name != 'pull_request'
        with:
          version: v2.17.1
          args: release --snapshot --clean --skip=publish,docker
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify all release archive contents
        if: github.event_name != 'pull_request'
        run: go run ./scripts/verify-release-archive.go --all

      - name: Upload release archives
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: release-snapshot
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
          if-no-files-found: error
          retention-days: 1

  release-archive-smoke:
    name: Release archive (${{ matrix.name }})
    if: github.event_name != 'pull_request'
    needs: release-snapshot
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
          - name: macOS
            os: macos-latest
          - name: Windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/download-artifact@v8
        with:
          name: release-snapshot
          path: dist

      - name: Verify native release archive
        run: go run ./scripts/verify-release-archive.go
