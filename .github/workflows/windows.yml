name: Windows

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - 'make'
      - 'make.bat'
      - '.github/workflows/windows.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-windows:
    name: Go (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # Defender's real-time scan of every object file the Go toolchain writes
      # is what makes Build and Test slow on the Windows runner, not a cold
      # cache -- setup-go already restores the module and build caches above.
      # Excluding the workspace and the Go caches from the scan is the standard
      # fix. It is best-effort: the exclusions only speed the run up, so a
      # runner that will not set them must not fail the job over it.
      - name: Exclude Go paths from Defender
        shell: pwsh
        continue-on-error: true
        run: |
          $paths = @(
            $env:GITHUB_WORKSPACE,
            (go env GOCACHE),
            (go env GOMODCACHE),
            $env:TEMP
          ) | Where-Object { $_ }
          foreach ($p in $paths) {
            Add-MpPreference -ExclusionPath $p -ErrorAction SilentlyContinue
          }

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # Runs through make.bat so the shim and the tools/mk task runner are covered
      # alongside the suite.
      - name: Test
        run: .\make.bat test
