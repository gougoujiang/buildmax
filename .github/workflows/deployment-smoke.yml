name: Deployment smoke

on:
  push:
    branches: [main]
    paths: &deployment-paths
      - '.github/workflows/deployment-smoke.yml'
      # deployment/** covers the Dockerfiles in deployment/docker and the local
      # kind manifests in deployment/dev-kind.
      - 'deployment/**'
      - 'cmd/**'
      - 'internal/**'
      - 'portal/**'
      - 'gui/**'
  pull_request:
    paths: *deployment-paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deployment-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose:
    name: Docker Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Run deployment smoke
        run: ./make compose smoke
      - name: Collect logs
        if: failure()
        run: ./make compose logs
      - name: Tear down
        if: always()
        run: ./make compose down

  kind:
    name: kind Kubernetes Job
    runs-on: ubuntu-latest
    env:
      BUILDMAX_KIND_CLUSTER: buildmax-ci
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Install kind
        run: go install sigs.k8s.io/kind@v0.31.0
      - name: Run deployment smoke
        run: ./make kind up
      # The browser tests run against the stack the smoke just brought up.
      # They cover what the API-level smoke cannot: whether the published
      # Portal bundle works against a real server.
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: portal/package-lock.json
      - name: Install Portal dependencies
        run: npm --prefix portal ci
      - name: Install Chromium
        run: npm --prefix portal exec -- playwright install --with-deps chromium
      - name: Run Portal browser tests
        run: ./make e2e
      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: portal/test-results/
          if-no-files-found: ignore
      - name: Collect logs
        if: failure()
        run: ./make kind logs
      - name: Tear down
        if: always()
        run: ./make kind down
