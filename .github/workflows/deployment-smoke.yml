# End-to-end verification of a real deployment. It is deliberately not a
# pull-request gate: pull requests keep the fast checks in ci.yml, and this
# runs after merge, on a schedule, and on demand.
#
# Because it runs after merge, a failure needs an owner: it is triaged by the
# author of the merge that broke it, and that merge is reverted if it is not
# fixed within one working day. A test that fails intermittently is quarantined
# the same day rather than retried — the browser suite sets retries: 0
# deliberately. See docs/design/end-to-end-testing.md §8.
#
# That ownership rule is enforced rather than written down: while this workflow's
# last completed run on main is red, ci.yml's "Deployment smoke health" job fails
# every pull request that is not labelled deployment-smoke-fix.
name: Deployment smoke

on:
  push:
    branches: [main]
  schedule:
    # Daily, so a deployment regression that no merge touched — a base image, a
    # published chart, an expired assumption — is found by a run rather than by
    # a release.
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Per commit, and never cancelling. Verification is evidence about one commit:
  # on main the ref is constant, so cancel-in-progress would let a second merge
  # discard the first one's evidence and leave that commit unproved.
  group: deployment-smoke-${{ github.sha }}
  cancel-in-progress: false

jobs:
  decide:
    name: Decide what to run
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.paths.outputs.run }}
      reason: ${{ steps.paths.outputs.reason }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The push's own diff needs the commit before it. On a merge to main
          # HEAD^ is the previous main, which is exactly the range to inspect.
          fetch-depth: 2
      # The filter lives here rather than in `on:` so a skipped suite is still
      # reported. A path filter up there produces no run at all, and "no run"
      # is indistinguishable from "nothing to verify" when someone later asks
      # what proved this commit.
      - name: Decide from the changed paths
        id: paths
        run: |
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "reason=${{ github.event_name }} always runs the full suite" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only HEAD^ HEAD || echo "")
          if [ -z "$changed" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "reason=the changed paths could not be read, so the suite runs" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if echo "$changed" | grep -Eq '^(deployment|cmd|internal|portal|gui)/|^\.github/workflows/deployment-smoke\.yml$'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "reason=deployment-relevant paths changed" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "reason=no deployment-relevant path changed" >> "$GITHUB_OUTPUT"
          fi

  compose:
    name: Docker Compose
    needs: decide
    if: needs.decide.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Run deployment smoke
        run: ./make compose smoke
      # The same browser tests the kind job runs, against the other supported
      # deployment shape. Compose is the quickstart, and it is the one that
      # keeps run state on local disk rather than in object storage — so it
      # exercises code paths the kind job never reaches.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: portal/package-lock.json
      - name: Install Portal dependencies
        run: npm --prefix portal ci
      # The browser binaries are a ten-second download; `--with-deps` is the
      # expensive half, and it is the half that stalls -- on 2026-08-19 its
      # apt-get sat for 37m34s before the first byte of Chromium arrived and
      # turned a five-minute run into forty-two. Cache what is cacheable, and
      # bound the rest so a stalled mirror fails instead of holding the runner.
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('portal/package-lock.json') }}
      - name: Install Chromium
        timeout-minutes: 6
        run: npm --prefix portal exec -- playwright install --with-deps chromium
      - name: Run Portal browser tests
        run: ./make e2e compose
      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces-compose
          path: .artifacts/e2e/portal/
          if-no-files-found: ignore
      # Managed task-run inference is a separate stack because transport is
      # startup configuration, and it goes last because it replaces the running
      # server. It proves what the direct run cannot: a worker completing a real
      # task while holding no provider credential.
      - name: Run deployment smoke with managed inference
        run: ./make compose smoke managed
      - name: Collect logs
        if: failure()
        run: ./make compose logs
      - name: Tear down
        if: always()
        run: ./make compose down

  kind:
    name: kind Kubernetes Job
    needs: decide
    if: needs.decide.outputs.run == 'true'
    runs-on: ubuntu-latest
    env:
      BUILDMAX_KIND_CLUSTER: buildmax-ci
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      # No kind install step: ./make runs the version tools/mk pins.
      - name: Run deployment smoke
        run: ./make kind up
      # The browser tests run against the stack the smoke just brought up.
      # They cover what the API-level smoke cannot: whether the published
      # Portal bundle works against a real server.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: portal/package-lock.json
      - name: Install Portal dependencies
        run: npm --prefix portal ci
      # The browser binaries are a ten-second download; `--with-deps` is the
      # expensive half, and it is the half that stalls -- on 2026-08-19 its
      # apt-get sat for 37m34s before the first byte of Chromium arrived and
      # turned a five-minute run into forty-two. Cache what is cacheable, and
      # bound the rest so a stalled mirror fails instead of holding the runner.
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('portal/package-lock.json') }}
      - name: Install Chromium
        timeout-minutes: 6
        run: npm --prefix portal exec -- playwright install --with-deps chromium
      - name: Run Portal browser tests
        run: ./make e2e kind
      # Last, because it leaves the cluster in managed mode. It covers the
      # delivery path the Compose job cannot: a run token reaching a worker
      # through a Job spec rather than a child process environment.
      - name: Run deployment smoke with managed inference
        run: ./make kind smoke managed
      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: .artifacts/e2e/portal/
          if-no-files-found: ignore
      - name: Collect logs
        if: failure()
        run: ./make kind logs
      - name: Tear down
        if: always()
        run: ./make kind down

  summary:
    name: Report what verified this commit
    needs: [decide, compose, kind]
    if: always()
    runs-on: ubuntu-latest
    steps:
      # A suite that did not run must say so in its own words. Reporting
      # "skipped" without the reason is what turns a policy decision into
      # apparent proof that the journey passed.
      - name: Write the summary
        env:
          RUN: ${{ needs.decide.outputs.run }}
          REASON: ${{ needs.decide.outputs.reason }}
          COMPOSE: ${{ needs.compose.result }}
          KIND: ${{ needs.kind.result }}
        run: |
          describe() {
            case "$1" in
              success) echo "ran and passed" ;;
              failure) echo "ran and FAILED" ;;
              cancelled) echo "cancelled before it finished — this commit is not verified" ;;
              skipped) echo "skipped by policy: $REASON" ;;
              *) echo "$1" ;;
            esac
          }
          {
            echo "## Deployment smoke"
            echo
            echo "Commit: \`${{ github.sha }}\`"
            echo
            echo "| Suite | Outcome |"
            echo "|---|---|"
            echo "| Docker Compose | $(describe "$COMPOSE") |"
            echo "| kind Kubernetes Job | $(describe "$KIND") |"
            echo
            if [ "$RUN" != "true" ]; then
              echo "No suite ran. This commit carries no deployment evidence."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      # The summary is a report, not a verdict: a failed suite still has to fail
      # the run, and a cancelled one must not read as success.
      - name: Fail when a suite did not pass
        if: needs.decide.outputs.run == 'true' && (needs.compose.result != 'success' || needs.kind.result != 'success')
        run: |
          echo "compose=${{ needs.compose.result }} kind=${{ needs.kind.result }}"
          exit 1
