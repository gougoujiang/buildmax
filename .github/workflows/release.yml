name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write   # create the GitHub release and upload archives
  packages: write   # push the container image to ghcr.io
  id-token: write   # sign GitHub artifact attestations through OIDC
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # GoReleaser derives the version from tags, so it needs the full history.
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: anchore/sbom-action/download-syft@v0.24.0
        with:
          syft-version: v1.51.0

      # Required to build the linux/arm64 image on an amd64 runner.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.17.1
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve container tag
        id: release-meta
        shell: bash
        run: echo "image_tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Scan published container image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/gougoujiang/buildmax:${{ steps.release-meta.outputs.image_tag }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      # Artifact attestations are public infrastructure. Skip them while the
      # repository is private; they become mandatory when it is made public.
      - name: Attest release archives and SBOMs
        if: github.event.repository.visibility == 'public'
        uses: actions/attest@v4
        with:
          subject-checksums: ./dist/checksums.txt

      - name: Attest published container image
        if: github.event.repository.visibility == 'public'
        uses: actions/attest@v4
        with:
          subject-checksums: ./dist/digests.txt
