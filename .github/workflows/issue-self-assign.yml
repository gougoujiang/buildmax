name: Issue Self-Assign

# Let any contributor claim an issue by commenting "/assign" (and release it
# with "/unassign"), without needing triage permission on the repository.
on:
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: issue-self-assign-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  self-assign:
    # Ignore comments on pull requests; only issues are claimable this way.
    if: >-
      github.event.issue.pull_request == null &&
      (startsWith(github.event.comment.body, '/assign') ||
       startsWith(github.event.comment.body, '/unassign'))
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.comment.body.trim();
            const commenter = context.payload.comment.user.login;
            const issue = context.payload.issue;
            const common = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
            };
            const assignees = (issue.assignees || []).map((a) => a.login);

            if (body.startsWith('/unassign')) {
              if (!assignees.includes(commenter)) {
                return;
              }
              await github.rest.issues.removeAssignees({
                ...common,
                assignees: [commenter],
              });
              return;
            }

            // "/assign": re-adding the commenter's own claim is idempotent.
            if (assignees.includes(commenter)) {
              await github.rest.issues.addAssignees({
                ...common,
                assignees: [commenter],
              });
              return;
            }

            // Held by someone else: report who, do not steal it.
            if (assignees.length > 0) {
              await github.rest.issues.createComment({
                ...common,
                body: `@${commenter} this issue is already assigned to ` +
                  assignees.map((a) => `@${a}`).join(', ') +
                  `. Comment \`/unassign\` on it once free, or ask them to release it.`,
              });
              return;
            }

            // Unclaimed: cap how many open issues one person may hold so the
            // backlog is not hoarded. The stale-assignment sweep releases the
            // ones that go quiet.
            const MAX_OPEN = 2;
            const search = await github.rest.search.issuesAndPullRequests({
              q: `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open assignee:${commenter}`,
            });
            if (search.data.total_count >= MAX_OPEN) {
              await github.rest.issues.createComment({
                ...common,
                body: `@${commenter} you already hold ${search.data.total_count} open ` +
                  `assigned issues (the limit is ${MAX_OPEN}). Finish or \`/unassign\` ` +
                  `one before claiming another.`,
              });
              return;
            }

            await github.rest.issues.addAssignees({
              ...common,
              assignees: [commenter],
            });
