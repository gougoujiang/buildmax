name: Portal image

# The Portal image is built here rather than in the release workflow on purpose.
# That workflow already carries 15 cross-compiled binaries, SBOMs, attestations,
# a Trivy scan, and archive smoke checks across three platforms; adding an npm
# build to it would let a frontend problem block the Go binaries from shipping.
# The two stay aligned because both derive their tag from the same `v*` ref.

# A tag publishes and is deliberately not path-filtered: `paths` under `push`
# applies to tags too, so filtering here would skip the release build whenever a
# release commit happened not to touch portal/. Pull requests carry the filter
# instead, since their job is only to prove the image still builds.
on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - 'portal/**'
      - 'gui/**'
      - 'deployment/docker/Dockerfile.portal'
      - '.github/workflows/portal-image.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portal-image-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/gougoujiang/buildmax-portal

jobs:
  image:
    name: Build and publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write      # sign the artifact attestation through OIDC
      attestations: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Only a tag publishes. Everything else builds and throws the result
      # away, which is what catches a broken Dockerfile or a portal build
      # failure on the pull request that caused it.
      - name: Resolve tag and whether to publish
        id: meta
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            # Same tag derivation as .github/workflows/release.yml, so the
            # Portal image and the server image carry identical versions.
            {
              echo "publish=true"
              echo "tags=${IMAGE}:${GITHUB_REF_NAME#v}"
              echo "platforms=linux/amd64,linux/arm64"
            } >> "$GITHUB_OUTPUT"
          else
            # One platform is enough to prove the image builds, and it keeps
            # the pull request check quick.
            {
              echo "publish=false"
              echo "tags=${IMAGE}:ci"
              echo "platforms=linux/amd64"
            } >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/login-action@v4
        if: steps.meta.outputs.publish == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          file: deployment/docker/Dockerfile.portal
          platforms: ${{ steps.meta.outputs.platforms }}
          tags: ${{ steps.meta.outputs.tags }}
          push: ${{ steps.meta.outputs.publish == 'true' }}
          # The npm install and build dominate the runtime; caching them keeps
          # a Portal-only change from paying for the whole tree every time.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: ${{ steps.meta.outputs.publish == 'true' }}
          sbom: ${{ steps.meta.outputs.publish == 'true' }}

      # Alpha images must not move `latest`; the tag stays unset until there is
      # a release line that deserves it. See docs/contribute/releasing.md.
      - name: Scan the published image
        if: steps.meta.outputs.publish == 'true'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.tags }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      # Artifact attestations are public infrastructure. Skip them while the
      # repository is private; they become mandatory when it is made public.
      - name: Attest the published image
        if: steps.meta.outputs.publish == 'true' && github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
