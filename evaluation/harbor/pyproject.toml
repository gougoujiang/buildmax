[project]
name = "buildmax-harbor"
version = "1.0.0"
description = "BuildMax's custom-Agent adapter for the Harbor benchmark harness"
requires-python = ">=3.12"
# Pinned exactly, not floored. This adapter reaches two underscore-prefixed
# helpers on Harbor's installed-agent base class, and the CLI it is driven by
# renamed --agent-import-path in 0.22.0. A range would let a background upgrade
# change a benchmark result with no commit here to explain it. The same version
# is recorded in pins.json, which is what a Go-side report reads.
dependencies = ["harbor==0.22.0"]

[project.optional-dependencies]
# Cloud sandboxes, for the concurrency a full 89-task run needs. Kept optional
# because the canary subset runs locally against Docker.
daytona = ["harbor[daytona]==0.22.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/buildmax_harbor"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.14"]

[tool.pytest.ini_options]
# The suite covers the two modules that import no Harbor code, so it runs
# against a bare interpreter. Adding the source path here is what keeps that
# true: installing the package would pull the harness in as a dependency.
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
