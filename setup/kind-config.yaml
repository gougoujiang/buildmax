# Kind cluster for local dev. Control-plane exposes 80/443 for ingress-nginx.
# If the cluster was created before this config had extraPortMappings, run:
#   ./make unsetup && ./make setup
# to recreate the cluster with Ingress support.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
  - role: worker
