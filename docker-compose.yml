# Docker Compose for local development
# Usage: docker compose up -d

services:
  mysql:
    image: mysql:8.0
    container_name: buildmax-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-buildmax_dev}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-buildmax}
      MYSQL_USER: ${MYSQL_USER:-buildmax}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-buildmax_dev}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-buildmax}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  mysql_data:
