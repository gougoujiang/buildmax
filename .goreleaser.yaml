# GoReleaser configuration. Triggered by pushing a v* tag; see
# .github/workflows/release.yml.
#
# Scope note: the Wails desktop app is deliberately not released here. It needs
# per-OS runners to produce a .app bundle and an .exe, and an unsigned, unnotarized
# macOS bundle is refused by Gatekeeper — so shipping one would be worse than
# shipping none. Build it locally with ./make build.
version: 2

project_name: buildmax

before:
  hooks:
    - go mod tidy
    # Apache-2.0 4(d): the binaries below statically link their dependencies, so
    # every archive and image carries those dependencies' license texts.
    - go install github.com/google/go-licenses@v1.6.0
    - go run ./cmd/mk release notices

builds:
  - id: buildmax
    main: ./cmd/buildmax
    binary: buildmax
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
    flags: [-trimpath]
    ldflags: &ldflags
      - -s -w
      - -X github.com/gougoujiang/buildmax/internal/config.Version={{ .Version }}
      - -X github.com/gougoujiang/buildmax/internal/config.Commit={{ .ShortCommit }}

  - id: buildmax-server
    main: ./cmd/buildmax-server
    binary: buildmax-server
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
    flags: [-trimpath]
    ldflags: *ldflags

  - id: buildmax-worker
    main: ./cmd/buildmax-worker
    binary: buildmax-worker
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
    flags: [-trimpath]
    ldflags: *ldflags

archives:
  # One archive per platform holding all three binaries. The server spawns the
  # worker by name and the CLI shares its data directory, so splitting them into
  # separate downloads would only create ways to end up with a mismatched set.
  - id: default
    ids: [buildmax, buildmax-server, buildmax-worker]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - NOTICE-THIRD-PARTY
      - README.md
      - SECURITY.md
      - CHANGELOG.md
      - src: config-examples/*
        dst: config-examples

checksum:
  name_template: checksums.txt

sboms:
  - id: archives
    artifacts: archive

docker_digest:
  name_template: digests.txt

dockers_v2:
  - id: buildmax
    ids: [buildmax, buildmax-server, buildmax-worker]
    images: ["ghcr.io/gougoujiang/buildmax"]
    dockerfile: deployment/docker/Dockerfile.release
    platforms: [linux/amd64, linux/arm64]
    # Buildx attaches an image SBOM and provenance attestation. Keep this
    # explicit even though GoReleaser currently defaults it to true.
    sbom: true
    extra_files: [LICENSE, NOTICE-THIRD-PARTY]
    tags:
      - "{{ .Version }}"
      # `latest` should not point at an alpha, so it only moves on a final release.
      - "{{ if not .Prerelease }}latest{{ end }}"
    labels:
      org.opencontainers.image.source: https://github.com/gougoujiang/buildmax
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.licenses: Apache-2.0
      org.opencontainers.image.description: >-
        Out-of-the-box, privately deployable Agent platform: CLI, server, and worker.

changelog:
  # The published history starts at a squashed initial commit, so a generated
  # changelog would be noise. The release body is composed instead by
  # `./make release notes <version>` from that version's CHANGELOG.md section,
  # and the workflow passes it as --release-notes; a notes file replaces the
  # header and footer, so this file no longer carries either.
  #
  # This stays enabled because --release-notes is read by this pipe: disabling
  # it drops the file silently, and v0.2.0-alpha.2 published with an empty
  # body. The flag is what skips generation, so the git log never reaches a
  # release the workflow composed notes for.
  disable: false

release:
  # A tag like v0.1.0-alpha marks the GitHub release as a pre-release.
  prerelease: auto
