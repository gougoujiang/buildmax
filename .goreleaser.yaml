# GoReleaser configuration. Triggered by pushing a v* tag; see
# .github/workflows/release.yml.
#
# Scope note: the Wails desktop app is deliberately not released here. It needs
# per-OS runners to produce a .app bundle and an .exe, and an unsigned, unnotarized
# macOS bundle is refused by Gatekeeper — so shipping one would be worse than
# shipping none. Build it locally with ./make build.
version: 2

project_name: buildmax

before:
  hooks:
    - go mod tidy
    # Apache-2.0 4(d): the binaries below statically link their dependencies, so
    # every archive and image carries those dependencies' license texts.
    - go install github.com/google/go-licenses@latest
    - ./scripts/gen-third-party-notices.sh

builds:
  - id: buildmax
    main: ./cmd/buildmax
    binary: buildmax
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
    flags: [-trimpath]
    ldflags: &ldflags
      - -s -w
      - -X github.com/gougoujiang/buildmax/internal/config.Version={{ .Version }}
      - -X github.com/gougoujiang/buildmax/internal/config.Commit={{ .ShortCommit }}

  - id: buildmax-server
    main: ./cmd/buildmax-server
    binary: buildmax-server
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
    flags: [-trimpath]
    ldflags: *ldflags

  - id: buildmax-worker
    main: ./cmd/buildmax-worker
    binary: buildmax-worker
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
    flags: [-trimpath]
    ldflags: *ldflags

archives:
  # One archive per platform holding all three binaries. The server spawns the
  # worker by name and the CLI shares its data directory, so splitting them into
  # separate downloads would only create ways to end up with a mismatched set.
  - id: default
    ids: [buildmax, buildmax-server, buildmax-worker]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - NOTICE-THIRD-PARTY
      - README.md
      - SECURITY.md
      - src: config-examples/*
        dst: config-examples

checksum:
  name_template: checksums.txt

dockers_v2:
  - id: buildmax
    ids: [buildmax, buildmax-server, buildmax-worker]
    images: ["ghcr.io/gougoujiang/buildmax"]
    dockerfile: Dockerfile.release
    platforms: [linux/amd64, linux/arm64]
    extra_files: [LICENSE, NOTICE-THIRD-PARTY]
    tags:
      - "{{ .Version }}"
      # `latest` should not point at an alpha, so it only moves on a final release.
      - "{{ if not .Prerelease }}latest{{ end }}"
    labels:
      org.opencontainers.image.source: https://github.com/gougoujiang/buildmax
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.licenses: Apache-2.0
      org.opencontainers.image.description: >-
        Out-of-the-box, privately deployable Agent platform: CLI, server, and worker.

changelog:
  # The published history starts at a squashed initial commit, so generated
  # changelogs would be noise for the first releases. Release notes are written
  # by hand until there is a real commit history to summarize.
  disable: true

release:
  # A tag like v0.1.0-alpha marks the GitHub release as a pre-release.
  prerelease: auto
  header: |
    BuildMax is an out-of-the-box, privately deployable Agent platform built on
    one shared Go Agent Runtime. The same runtime backs a CLI/TUI for local
    terminal work, a desktop app, and a team Portal served by the Go server,
    with a scheduler and worker pipeline for background task runs.

    ## Install

    Download the archive for your platform below. Each one contains all three
    binaries — `buildmax`, `buildmax-server`, `buildmax-worker` — plus
    `config-examples/`, `LICENSE`, and `NOTICE-THIRD-PARTY`. Verify it against
    `checksums.txt` first.

    With a Go toolchain, for the CLI alone:

    ```
    go install github.com/gougoujiang/buildmax/cmd/buildmax@{{ .Tag }}
    ```

    As a container, for linux/amd64 and linux/arm64:

    ```
    docker pull ghcr.io/gougoujiang/buildmax:{{ .Version }}
    ```

    ## Getting started

    Set `BUILDMAX_API_KEY` (and optionally `BUILDMAX_BASE_URL` and
    `BUILDMAX_MODEL`), then run `buildmax` for the TUI, or
    `buildmax -p "your prompt"` for a single non-interactive turn. Running the
    server and Portal additionally needs MySQL and object storage; see the
    README.

    The desktop app is not published here. It needs code signing and
    notarization to launch on macOS, so build it locally with `./make build`.
  footer: |
    ## Before you deploy this

    This is an alpha, and two defaults deserve to be read as warnings rather
    than footnotes:

    - **Server authentication is not production-ready.** There is no OTP
      delivery channel, so `POST /api/login` is disabled by default. The
      optional `dev_login_otp` setting enables a single fixed code that
      authenticates *any* registered email address. Putting the Portal on a
      network you do not control requires wiring a real identity provider first.
    - **The bash sandbox is off by default**, and worker hardening is
      incomplete.

    `SECURITY.md` lists both, along with how to report a vulnerability
    privately. Interfaces and deployment guidance may change before a stable
    release.
