# BuildMax operator policy (BUILDMAX_HOME/policy.yaml)
#
# For when the machine owner and the agent user aren't the same person. This
# OVERRIDES the matching block in settings.yaml, so a user can't loosen what
# an operator sets here by editing their own settings.
#
# Resolution order, lowest to highest:
#   built-in default  <  settings.yaml  <  policy.yaml  <  environment variable
#
# `buildmax sandbox status` prints the resolved values and which layer set
# each one — the fastest way to confirm a policy is taking effect.
#
# Guide: docs/guide/sandbox.md, docs/guide/plugins.md
# Reference: docs/reference/configuration.md
# Design: docs/design/sandbox-boundaries.md, docs/design/plugin-marketplace.md

sandbox:
  enabled: true

  # Refuse to run Bash at all rather than run it unsandboxed. Turns a silent
  # downgrade into a clear failure on a host missing the sandbox backend —
  # usually what an operator wants, usually not what a laptop dev wants.
  fail_if_unavailable: true

  # Leave the per-call escape hatch inert: a tool call asking for
  # dangerously_disable_sandbox is ignored rather than honored.
  allow_unsandboxed_commands: false

  filesystem:
    allow_write: ["."]
    deny_write:
      - "~/.ssh"
      - "~/.aws"
      - "~/.gnupg"
      - "~/.buildmax"
    deny_read:
      - "~/.ssh"
      - "~/.aws"
      - "~/.gnupg"

    # Make this layer authoritative: a lower layer's allow_read is ignored,
    # so a user can't widen read access from their own settings.yaml.
    allow_managed_read_paths_only: true

  network:
    # An allowlist an operator is willing to stand behind. Everything else is
    # refused by the Go-side egress proxy.
    allowed_domains:
      - "api.github.com"
      - "proxy.golang.org"
      - "registry.npmjs.org"
    denied_domains: []

    allow_local_binding: false
    allow_all_unix_sockets: false
    # Granting a socket grants whatever is behind it — the Docker socket is
    # effectively root on the host. List them one at a time, deliberately.
    allow_unix_sockets: []

    # Same idea as allow_managed_read_paths_only, for domains.
    allow_managed_domains_only: true

  # Known-harmless violations to silence, so the log stays worth reading.
  # Prefer this over widening the boundary.
  ignore_violations:
    read:
      - "/etc/ssl/**"

# Which plugin sources may load. Unset means every source loads. Setting it
# constrains where plugins come from, not what they may do — tool
# permissions, hook gates, and the sandbox above constrain the bytes that
# load. A directory whose provenance can't be established doesn't pass a
# policy that names one: unknown is not the source you asked for.
#
# This is fleet management, not a security boundary — policy.yaml lives in
# the user's own BUILDMAX_HOME, so it's worth setting on a machine an
# operator controls (managed device, built image, container) and worth
# nothing against someone who could write the configuration by hand.
plugins:
  allowed_sources: ["marketplace"]
