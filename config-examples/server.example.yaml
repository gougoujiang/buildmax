# BuildMax server configuration (BUILDMAX_HOME/server.yaml)
# Copy to BUILDMAX_HOME/server.yaml and fill in your values.
# Secret-bearing fields can be overridden by the BUILDMAX_* variables documented
# in docs/reference/configuration.md.

log_level: info
port: 5678

# JWT signing secret for auth tokens.
# Production: leave blank here and inject via BUILDMAX_JWT_SECRET env var.
# Local dev: set directly.
jwt_secret: your-jwt-secret-here

# Who may create an account. Closed by default: accounts are created by an
# operator, on the server, with
#
#   buildmax-server user create alice@example.com
#   buildmax-server user login-code alice@example.com
#
# People sign in with a password. A new account has none, so the second command
# prints a single-use code — valid for an hour, usable by that account only —
# which they redeem and then set a password from account settings. The same
# command is how someone who forgot their password gets back in. Deliver the
# code however you already talk to the person; BuildMax has no mail channel.
#
# Setting this to true lets anyone who can reach the server register an address.
# allow_signup: true

# Token lifetimes. Signing in returns two credentials: a signed access token
# sent with every request, and a refresh token exchanged for the next pair.
#
# The access token is not stored anywhere, so it cannot be revoked — its
# lifetime is the window in which a leaked one still works. The refresh token
# is a database row, so revoking a session takes effect at the next exchange.
# Each exchange also rotates the refresh token, and presenting a spent one
# revokes the whole session: that is how a copied credential is noticed.
access_token_ttl: 168h
refresh_token_ttl: 720h

# How long a just-rotated refresh token may be exchanged again before that
# counts as reuse. It exists because the CLI and Desktop share one credentials
# file between processes, and two of them refreshing at once is normal. Raising
# it widens the window in which a stolen token goes unnoticed.
refresh_rotation_grace: 30s

cors_origin: http://localhost:5173
workspaces_dir: /data/buildmax/workspaces
default_quota_tier: free_trial

# Tier 1 conversation LLM used by the portal agent loop.
conversation:
  model:
    model: openai/gpt-4o
    name: GPT-4o
    api_url: https://openrouter.ai/api/v1
    api_key: your-openrouter-api-key
    context_window: 128000
    call_timeout: 300            # per-call timeout in seconds (0 = default 300)
    # provider: openai_compatible  # wire protocol: openai_compatible (default),
                                   # openai (Responses API), or anthropic
    # max_tokens: 0                # cap on one response; 0 = the adapter default

  # Use a catalog model for Tier 1 instead of the model above. This is an
  # llm_model ID, not a team alias: the server picks its own model rather than
  # being granted one. Leave unset to use conversation.model.
  # model_target: lm_xxxxxxxxxxxxxxxxxxxx

# Team model policy for the managed LLM gateway.
#
# The catalog itself is in the llm_model database table, not here, because it
# holds provider credentials and changes while the server runs:
#
#   buildmax-server model add --name Fast \
#       --api-url https://openrouter.ai/api/v1 \
#       --api-key your-openrouter-api-key \
#       --model openai/gpt-4o-mini --context-window 128000
#   buildmax-server model list
#
# This block only says which of those models each team may name, and under what
# alias. Leaving it out means no team may call the gateway: a catalog says which
# models exist, not who may use them.
#
# See docs/design/llm-gateway.md.
# llm:
#   aliases:
#     default: lm_xxxxxxxxxxxxxxxxxxxx   # a model ID from `model list`
#     deep: lm_yyyyyyyyyyyyyyyyyyyy
#   # Alias used when a caller names none. Required when more than one exists.
#   default_alias: default

database:
  host: localhost
  port: 3306
  user: buildmax
  password: buildmax
  name: buildmax
  # go-sql-driver tls mode. Unset means "preferred": TLS whenever the server
  # offers it, certificate not verified. Use "true" to require TLS and verify
  # against the system roots — the right setting when pointing at a managed
  # database such as RDS, Aurora, or Cloud SQL. "skip-verify" requires TLS and
  # accepts any certificate; "false" never uses it.
  tls: ""

webhook:
  message_path: message
  user_id: webhook

worker:
  binary: buildmax-worker
  run_mode: local_process   # or k8s_job
  server_url: http://localhost:5678
  token: your-worker-token

  # How a task run reaches a model.
  #
  # "direct" (the default) means the worker calls a provider itself, using
  # conversation.model and its api_key. "buildmax" means the run calls this
  # server's managed gateway with a per-run credential, and no provider key is
  # given to the worker at all — which requires the llm.aliases block above.
  #
  # The alias is the only model identity a run gets: the endpoint, the upstream
  # model, and the credential stay on the server. Leave it empty to use
  # llm.default_alias.
  llm:
    transport: direct          # or buildmax
    alias: ""                  # e.g. default
    context_window: 0
    call_timeout: 0            # per-call timeout in seconds (0 = client default)

  # How long a run's credential stays valid. Every run gets one — it is what a
  # worker presents on its own API routes, not only to the gateway. It is not
  # renewable, so it must outlast the longest run: a run that outlives its token
  # can no longer report anything, including its own result.
  run_token_ttl: 24h

  # How long a run may stay SCHEDULED or RUNNING before the server records it as
  # abandoned. Only the worker moves a run out of those states, so without this a
  # run whose worker died stays there forever. Keep it at or below
  # run_token_ttl — a run that outlived its credential cannot report an outcome,
  # so nothing else will ever close it.
  run_timeout: 6h

  k8s:
    namespace: buildmax
    image: buildmax:local
    # ConfigMap holding a server.yaml key, mounted into every worker pod so the
    # worker reads the same configuration the server does. Empty means worker
    # pods fall back to built-in defaults, which is almost never what you want.
    config_map: buildmax-config
    home_dir: /buildmax          # BUILDMAX_HOME inside a worker pod
    # Worker pods are always non-root, with no service-account token, no added
    # capabilities, and a read-only root filesystem. That containment is not
    # configurable — a worker runs model-chosen shell commands. Set run_as_user
    # only on a cluster that assigns its own uid range (OpenShift most
    # commonly); 0 uses BuildMax's default of 65532.
    run_as_user: 0
    # Kubernetes quantity strings. An empty value leaves that request or limit
    # unset, so an unconfigured deployment stays unbounded rather than
    # inheriting a limit nobody chose.
    resources:
      cpu_request: ""
      cpu_limit: ""
      memory_request: ""
      memory_limit: ""

# Governance trail retention.
#
# 0 keeps every event forever, which is the default: a deployment that has not
# chosen a retention policy has not decided to discard evidence. Setting a
# window starts an hourly sweep, and each sweep that removed anything records an
# audit.pruned event naming the range and the count — so a trail that begins
# partway through says that policy shortened it. Nothing else deletes an audit
# event, and no interface can delete a particular one.
audit:
  retention_days: 0

storage:
  persist_backend: local_fs   # or minio
  artifact_backend: local_fs  # or minio
  minio:
    # Set endpoint for an S3-compatible store you run (MinIO, Ceph, a vendor's
    # service). Leave it empty for AWS S3 so the SDK resolves the regional
    # endpoint itself.
    endpoint: http://localhost:9000
    region: us-east-1
    # Leave both keys empty to use the SDK's default credential chain, which is
    # how a pod reaches a bucket through IRSA, workload identity, or an
    # instance profile instead of a long-lived key.
    access_key: minio
    secret_key: minio123
    bucket: bmstore
    prefix: workspaces
    # Bucket addressing. Unset derives it from endpoint: set means a compatible
    # store, which needs bucket-in-path; empty means AWS S3, which does not.
    # Set it only for a compatible store that uses virtual-host addressing.
    # path_style: true
