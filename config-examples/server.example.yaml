# BuildMax server configuration (BUILDMAX_HOME/server.yaml)
# Copy to BUILDMAX_HOME/server.yaml and fill in your values.
# Secret-bearing fields can be overridden by the BUILDMAX_* variables documented
# in docs/reference/configuration.md.

log_level: info
port: 5678

# JWT signing secret for auth tokens.
# Production: leave blank here and inject via BUILDMAX_JWT_SECRET env var.
# Local dev: set directly.
jwt_secret: your-jwt-secret-here

# Who may create an account. Closed by default: accounts are created by an
# operator, on the server, with
#
#   buildmax-server user create alice@example.com
#   buildmax-server user login-code alice@example.com
#
# The second command prints a single-use code, valid for an hour, that only that
# account can use. Deliver it however you already talk to the person — BuildMax
# has no mail channel. That is the supported way to sign in; no configuration is
# needed to enable it.
#
# Setting this to true lets anyone who can reach the server register an address.
# allow_signup: true

# Development-only fixed login OTP. When set, POST /api/login accepts this one
# code as the one-time password for EVERY registered account — anyone who knows
# a registered email address can sign in. It is a standing authentication
# bypass, not a credential, and single-use codes above replace it.
#
# Set it only on a local or otherwise trusted deployment. Never set it on a
# server reachable by untrusted users.
# dev_login_otp: "123456"

cors_origin: http://localhost:5173
workspaces_dir: /data/buildmax/workspaces
default_quota_tier: free_trial

# Tier 1 conversation LLM used by the portal agent loop.
conversation:
  model:
    model: openai/gpt-4o
    name: GPT-4o
    api_url: https://openrouter.ai/api/v1
    api_key: your-openrouter-api-key
    context_window: 128000
    call_timeout: 300            # per-call timeout in seconds (0 = default 300)

  # Use a catalog model for Tier 1 instead of the model above. This is an
  # llm_model ID, not a team alias: the server picks its own model rather than
  # being granted one. Leave unset to use conversation.model.
  # model_target: lm_xxxxxxxxxxxxxxxxxxxx

# Team model policy for the managed LLM gateway.
#
# The catalog itself is in the llm_model database table, not here, because it
# holds provider credentials and changes while the server runs:
#
#   buildmax-server model add --name Fast \
#       --api-url https://openrouter.ai/api/v1 \
#       --api-key your-openrouter-api-key \
#       --model openai/gpt-4o-mini --context-window 128000
#   buildmax-server model list
#
# This block only says which of those models each team may name, and under what
# alias. Leaving it out means no team may call the gateway: a catalog says which
# models exist, not who may use them.
#
# See docs/design/llm-gateway.md.
# llm:
#   aliases:
#     default: lm_xxxxxxxxxxxxxxxxxxxx   # a model ID from `model list`
#     deep: lm_yyyyyyyyyyyyyyyyyyyy
#   # Alias used when a caller names none. Required when more than one exists.
#   default_alias: default

database:
  host: localhost
  port: 3306
  user: buildmax
  password: buildmax
  name: buildmax

webhook:
  message_path: message
  user_id: webhook

worker:
  binary: buildmax-worker
  run_mode: local_process   # or k8s_job
  server_url: http://localhost:5678
  token: your-worker-token
  k8s:
    namespace: buildmax
    image: buildmax:local
    # ConfigMap holding a server.yaml key, mounted into every worker pod so the
    # worker reads the same configuration the server does. Empty means worker
    # pods fall back to built-in defaults, which is almost never what you want.
    config_map: buildmax-config
    home_dir: /buildmax          # BUILDMAX_HOME inside a worker pod
    # Worker pods are always non-root, with no service-account token, no added
    # capabilities, and a read-only root filesystem. That containment is not
    # configurable — a worker runs model-chosen shell commands. Set run_as_user
    # only on a cluster that assigns its own uid range (OpenShift most
    # commonly); 0 uses BuildMax's default of 65532.
    run_as_user: 0
    # Kubernetes quantity strings. An empty value leaves that request or limit
    # unset, so an unconfigured deployment stays unbounded rather than
    # inheriting a limit nobody chose.
    resources:
      cpu_request: ""
      cpu_limit: ""
      memory_request: ""
      memory_limit: ""

storage:
  persist_backend: local_fs   # or minio
  artifact_backend: local_fs  # or minio
  minio:
    endpoint: http://localhost:9000
    region: us-east-1
    access_key: minio
    secret_key: minio123
    bucket: bmstore
    prefix: workspaces
